<script>
document.addEventListener("DOMContentLoaded", () => {
  const images = [
    
      "\/lived\/06-11-vishwanagar\/05.jpg",
    
      "\/lived\/06-11-vishwanagar\/05a.jpg",
    
      "\/lived\/06-11-vishwanagar\/06.jpg",
    
      "\/lived\/06-11-vishwanagar\/thumb.jpg",
    
  ];

  
document.addEventListener('click', (e) => {
  
  if (!frame.contains(e.target)) {
    
    window.location.assign('/lived/');
  }
});

  if (!images || images.length === 0) return;

  let currentIndex = 0;
  const imgEl = document.getElementById('mainImage');
  const leftZone = document.getElementById('leftZone');
  const rightZone = document.getElementById('rightZone');
  const counter = document.getElementById('imageCounter');
  const frame = document.getElementById('imageFrame');

  
  const leftCursor = 'url(data:image/svg+xml;base64,PHN2ZyBmaWxsPSJjdXJyZW50Q29sb3IiIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiIgdmlld0JveD0iMCAwIDE2IDE2IiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxwb2x5bGluZSBwb2ludHM9IjEwLDEgNiw4IDEwLDE1IiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBmaWxsPSJub25lIi8+PC9zdmc+), auto';
  const rightCursor = 'url(data:image/svg+xml;base64,PHN2ZyBmaWxsPSJjdXJyZW50Q29sb3IiIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiIgdmlld0JveD0iMCAwIDE2IDE2IiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxwb2x5bGluZSBwb2ludHM9IjYsMSAxMCw4IDYsMTUiIHN0cm9rZT0iY3VycmVudENvbG9yIiBzdHJva2Utd2lkdGg9IjIiIGZpbGw9Im5vbmUiLz48L3N2Zz4=), auto';

  function updateCounter() {
    counter.textContent = `${currentIndex + 1} / ${images.length}`;
  }

  function showImage(index) {
    currentIndex = (index + images.length) % images.length;
    imgEl.src = images[currentIndex];
    imgEl.alt = `Image ${currentIndex + 1} of ${images.length}`;
    updateCounter();
  }

  function nextImage() { showImage(currentIndex + 1); }
  function prevImage() { showImage(currentIndex - 1); }
  function exitViewer() { window.location.assign('/lived/'); }

  showImage(0);

  
  leftZone.addEventListener('click', (e) => { e.stopPropagation(); prevImage(); });
  rightZone.addEventListener('click', (e) => { e.stopPropagation(); nextImage(); });

  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); exitViewer(); }
    else if (e.key === 'ArrowRight' || e.key === 'Right') { e.preventDefault(); nextImage(); }
    else if (e.key === 'ArrowLeft' || e.key === 'Left') { e.preventDefault(); prevImage(); }
  });

  
  let touchStartX = null;
  frame.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  frame.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const delta = e.changedTouches[0].screenX - touchStartX;
    if (delta < -50) nextImage();
    if (delta > 50) prevImage();
    touchStartX = null;
  });

  
  imgEl.addEventListener('dragstart', (e) => e.preventDefault());

  
  frame.addEventListener('mousemove', (e) => {
    const rect = frame.getBoundingClientRect();
    const x = e.clientX - rect.left;
    frame.style.cursor = (x < rect.width / 2) ? leftCursor : rightCursor;
  });
  frame.addEventListener('mouseleave', () => { frame.style.cursor = 'default'; });

});
</script>
