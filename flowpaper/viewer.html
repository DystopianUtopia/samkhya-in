<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Montage Flipbook Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script type="text/javascript" src="js/jquery.min.js"></script>
  <script type="text/javascript" src="js/jquery.extensions.min.js"></script>
  <script type="text/javascript" src="js/heartcode-canvasloader-min.js"></script>
  <script type="text/javascript" src="js/flowpaper.js"></script>

  <!-- Optional: Add swipe support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.touchswipe/1.6.19/jquery.touchSwipe.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background-color: #111;
    }
    #flipbook-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="flipbook-container"></div>

  <script type="text/javascript">
    // Read PDF filename from URL query (?pdf=yourfile.pdf)
    const params = new URLSearchParams(window.location.search);
    const pdfFile = params.get('pdf') || 'montage.pdf';

    $('#flipbook-container').FlowPaperViewer({
      config: {
        PDFFile: `pdf/${pdfFile}`,
        Scale: 1,
        ZoomTransition: 'easeOut',
        ZoomTime: 0.5,
        ZoomInterval: 0.2,
        FitPageOnLoad: true,
        ViewModeToolsVisible: true,
        FullScreenAsMaxWindow: false,
        localeChain: 'en_US',
        localeDirectory: 'locale/',

        // 🔒 Disable printing, text copy, and download
        DisablePrint: true,
        DisableTextCopy: true,
        DisableDownload: true,
        ShowDownloadControl: false
      }
    });
  </script>
</body>
</html>
